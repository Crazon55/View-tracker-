# NOT the config for the current server — that box uses conf.d, see deploy/frontseat.conf.
# This is the Debian/sites-available variant, kept for a box laid out that way.
#
# FSOS on thefrontseatmedia.com (apex cutover — replaces snoboard)
#
# One origin: nginx serves the built app and proxies /api to the FSOS backend on
# loopback. Browser never talks to :8000 directly.
#
# Install (once, on the AWS box):
#   sudo cp deploy/fsos.nginx.conf /etc/nginx/sites-available/fsos
#   sudo ln -sf /etc/nginx/sites-available/fsos /etc/nginx/sites-enabled/fsos
#   # Disable the old snoboard site if it has its own nginx vhost:
#   # sudo rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/snoboard
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d thefrontseatmedia.com -d www.thefrontseatmedia.com

server {
    listen 80;
    listen [::]:80;
    server_name thefrontseatmedia.com www.thefrontseatmedia.com;

    root /var/www/fsos;
    index index.html;

    access_log /var/log/nginx/fsos.access.log;
    error_log  /var/log/nginx/fsos.error.log;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering off;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
