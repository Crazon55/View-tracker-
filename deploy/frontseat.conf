# FSOS on thefrontseatmedia.com — Amazon Linux nginx (conf.d, not sites-available)
#
# Install on the EC2 box:
#   sudo cp deploy/frontseat.conf /etc/nginx/conf.d/frontseat.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot already manages TLS for this domain; after reload it should keep working.
# If HTTPS breaks, run: sudo certbot --nginx -d thefrontseatmedia.com -d www.thefrontseatmedia.com
# and choose option 1 (reinstall existing).

# Everything on port 80 goes to the canonical HTTPS name.
server {
    listen 80;
    listen [::]:80;
    server_name thefrontseatmedia.com www.thefrontseatmedia.com;
    return 301 https://thefrontseatmedia.com$request_uri;
}

# www exists only to hand people to the apex.
#
# Sign-in is origin-bound: the app asks Supabase to return to
# window.location.origin, and the session is stored per origin. Serving the app on both
# names would mean two entries in Supabase's allow list, two sessions, and someone
# signed in on one appearing signed out on the other. One canonical origin avoids it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.thefrontseatmedia.com;

    ssl_certificate     /etc/letsencrypt/live/thefrontseatmedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thefrontseatmedia.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://thefrontseatmedia.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name thefrontseatmedia.com;

    # Certbot paths — match the existing thefrontseatmedia.com cert
    ssl_certificate     /etc/letsencrypt/live/thefrontseatmedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thefrontseatmedia.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Served from /var/www, not out of the home directory. nginx runs as the `nginx`
    # user and /home/ec2-user is mode 700 on Amazon Linux, so pointing root inside it
    # gives a 403 on every request — the site looks broken with nothing in the app's
    # logs to explain it. The deploy script rsyncs the build here.
    root /var/www/fsos;
    index index.html;

    access_log /var/log/nginx/fsos.access.log;
    error_log  /var/log/nginx/fsos.error.log;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering off;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
